<div class="module" id="fdq-waitlist">
  <h2>Tier 1 waitlist</h2>
  <div style="padding: 0.9rem 0.9rem 0.2rem;">
    <div class="fdq-summary">
      <div class="fdq-card"><b>{{ on_list }}</b><span>On the list</span></div>
      <div class="fdq-card"><b>{{ week }}</b><span>New in 7 days</span></div>
      <div class="fdq-card"><b>{{ visitors_week }}</b><span>Visitors in 7 days</span></div>
      <div class="fdq-card"><b>{{ spam_week }}</b><span>Bots stopped in 7 days</span></div>
    </div>
    <p class="fdq-links"><a href="{{ signups_url }}">Signups</a><a href="{{ funnel_url }}">Visitor funnel</a></p>
  </div>
</div>
